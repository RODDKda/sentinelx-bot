# fly.toml - SentinelX MVP deployment config
app = "sentinelx-mvp"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[mounts]
  source = "sentinelx_data"
  destination = "/app/data"

[env]
  APP_NAME = "SentinelX MVP"
  DEBUG = "false"
