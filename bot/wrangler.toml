name = "sentinelx-bot"
main = "src/bot.ts"
compatibility_date = "2025-06-01"

[vars]
# Change to your Railway app URL after deployment
# Example: API_BASE_URL = "https://sentinelx.up.railway.app"
API_BASE_URL = "https://YOUR_APP.up.railway.app"
WEB_APP_URL = "https://YOUR_APP.up.railway.app"

[env.dev]
vars = { API_BASE_URL = "http://localhost:8000", WEB_APP_URL = "http://localhost:8000" }
